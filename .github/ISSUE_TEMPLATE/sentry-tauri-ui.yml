name: "sentry-tauri-ui"
description: Bug or improvement in the desktop app — the Tauri (Rust) shell hosting the React/TypeScript frontend.
title: "[sentry-tauri-ui] "
labels: ["sentry-tauri-ui"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for issues in `crates/sentry-tauri-ui` — the desktop app (React frontend in `src/`, Tauri Rust backend/window chrome in `src-tauri/`).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend (React/TypeScript UI)
        - Tauri backend (Rust, window chrome, commands)
        - Process table / Resource Monitor
        - Modal system
        - Sidebar / panels
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What's wrong, or what should be added/changed?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: OS / platform
      placeholder: "Windows 11, macOS 14, Ubuntu 22.04, ..."
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / recordings
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Console errors, related sentry-core behavior, etc.
    validations:
      required: false
