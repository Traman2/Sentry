name: Release Build

# Triggered by the `/release` skill pushing a `vX.Y.Z` tag (which also
# creates a draft GitHub Release with the notes). This workflow's only job
# is to build the Windows installer and attach it to that release, then
# publish it. `workflow_dispatch` is a manual fallback to re-run the build
# for an existing tag if it failed the first time.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for re-running a failed release build)"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/sentry-tauri-ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: crates/sentry-tauri-ui
        run: npm ci

      - name: Build Tauri app
        working-directory: crates/sentry-tauri-ui
        run: npm run tauri build

      - name: Attach installer to the release, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # `gh release view || gh release create --draft` covers a `v*` tag
        # pushed by hand (bypassing the /release skill, which normally
        # creates the draft release itself) — the build still produces a
        # usable release instead of failing outright.
        shell: bash
        run: |
          gh release view "$TAG" || gh release create "$TAG" --draft --title "$TAG"
          gh release upload "$TAG" \
            crates/sentry-tauri-ui/src-tauri/target/release/bundle/msi/*.msi \
            crates/sentry-tauri-ui/src-tauri/target/release/bundle/nsis/*.exe \
            --clobber
          gh release edit "$TAG" --draft=false
