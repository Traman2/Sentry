[project]
name = "sentry-agent"
version = "0.1.0"
description = "LangGraph agent driving the Sentry desktop app's MCP tools"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langgraph",
    "langchain-mcp-adapters",
    "langchain-groq",
    "python-dotenv",
    "websockets",
]

[project.scripts]
sentry-agent = "sentry_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentry_agent"]
