[project]
name = "system-expert-agent"
version = "0.1.0"
description = "LangGraph agent driving the System-Expert desktop app's MCP tools"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langchain-mcp-adapters",
    "langchain-groq",
    "python-dotenv",
    "websockets",
]

[project.scripts]
system-expert-agent = "system_expert_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["system_expert_agent"]
